<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olivia Design Agency - Advanced Simulation</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #1a1a2e; font-family: 'Segoe UI', Tahoma, sans-serif; color: white; overflow: hidden; }
        
        #game-container { display: flex; height: 100vh; width: 100vw; direction: ltr; }
        #canvas-wrapper { flex: 1; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; background: #0f0f1a; }
        
        /* الشريط الجانبي الأيمن (التحكم) */
        #sidebar-right { width: 280px; background: #16213e; padding: 20px; overflow-y: auto; border-left: 3px solid #0f3460; direction: rtl; flex-shrink: 0; box-shadow: -5px 0 15px rgba(0,0,0,0.5); z-index: 10; }
        
        /* الشريط الجانبي الأيسر (مركز التقارير) */
        #sidebar-left { width: 350px; background: #1a1a2e; padding: 20px; overflow-y: auto; border-right: 3px solid #e94560; direction: rtl; flex-shrink: 0; box-shadow: 5px 0 15px rgba(0,0,0,0.5); z-index: 10; display: flex; flex-direction: column; }
        
        h2 { color: #e94560; text-align: center; margin-bottom: 15px; font-size: 20px; border-bottom: 2px solid #e94560; padding-bottom: 10px; }
        h3 { color: #f1c40f; font-size: 16px; margin-bottom: 10px; }
        
        button { width: 100%; padding: 12px; margin-bottom: 10px; background: #0f3460; color: white; border: 2px solid #e94560; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; transition: 0.3s; }
        button:hover { background: #e94560; transform: translateY(-2px); }
        
        #log { background: #000; padding: 10px; height: 150px; overflow-y: auto; font-size: 11px; border-radius: 8px; border: 1px solid #444; margin-top: 10px; }
        .log-entry { margin-bottom: 6px; color: #aaa; line-height: 1.3; }
        .log-highlight { color: #f1c40f; font-weight: bold; }

        /* مركز التقارير */
        #reports-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .report-card { background: #fff; color: #333; padding: 15px; border-radius: 10px; border-right: 6px solid #e94560; box-shadow: 0 4px 10px rgba(0,0,0,0.3); animation: slideIn 0.5s ease-out; }
        @keyframes slideIn { from { transform: translateX(-50px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .report-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px dashed #ccc; padding-bottom: 5px; }
        .report-title { font-weight: bold; color: #0f3460; font-size: 15px; }
        .report-emp { font-size: 12px; background: #e94560; color: white; padding: 2px 6px; border-radius: 4px; }
        .report-body { font-size: 13px; line-height: 1.6; }
        .report-body ul { padding-right: 20px; margin-top: 5px; margin-bottom: 5px; }
        .manager-note { background: #fff3cd; border-right: 4px solid #f1c40f; padding: 8px; margin-top: 10px; color: #856404; font-size: 12px; border-radius: 4px; font-style: italic; }
        
        .badge { display: inline-block; background: #2980b9; color: white; padding: 2px 8px; border-radius: 4px; font-size: 11px; margin-bottom: 8px; }
    </style>
</head>
<body>
    <div id="game-container">
        
        <!-- الشريط الجانبي الأيمن (التحكم) -->
        <div id="sidebar-right">
            <h2>🎨 Olivia Agency</h2>
            <button id="btn-task" onclick="assignTask()">📋 إطلاق مهمة جديدة</button>
            <button id="btn-meeting" onclick="callMeeting()" style="background:#e67e22; border-color:#e67e22;">📢 اجتماع طارئ مع المديرة</button>
            <button id="btn-comp" onclick="analyzeCompetitors()" style="background:#2980b9; border-color:#3498db;">🔍 تحليل الحسابات المنافسة</button>
            <button id="btn-advice" onclick="getInstagramAdvice()" style="background:#8e44ad; border-color:#9b59b6;">💡 نصائح لتطوير الحساب</button>
            
            <h3 style="margin-top:20px;">📝 سجل الأحداث المباشر:</h3>
            <div id="log"></div>
        </div>

        <!-- منطقة اللعبة -->
        <div id="canvas-wrapper">
            <div id="phaser-game"></div>
        </div>

        <!-- الشريط الجانبي الأيسر (مركز التقارير) -->
        <div id="sidebar-left">
            <h2>📊 مركز التقارير</h2>
            <div id="reports-container">
                <p style="color:#777; text-align:center; font-size:12px; margin-top:20px;">قم بتشغيل المهام لترى النتائج هنا...</p>
            </div>
        </div>
    </div>

    <script>
        const GAME_WIDTH = window.innerWidth - 630; // 280 يمين + 350 يسار
        const GAME_HEIGHT = window.innerHeight;
        
        const COLORS = [0xe94560, 0x0f3460, 0x16c79a, 0xf1c40f, 0x9b59b6, 0xe67e22];
        
        const ROOMS = {
            manager: { x: 20, y: 20, w: 180, h: 150, name: 'مكتب المديرة', color: 0x2c3e50 },
            design: { x: 220, y: 20, w: 180, h: 150, name: 'قسم التصميم', color: 0x3498db },
            social: { x: 420, y: 20, w: 180, h: 150, name: 'السوشيال ميديا', color: 0xe1306c },
            meeting: { x: 20, y: 190, w: 280, h: 200, name: 'قاعة الاجتماعات', color: 0xe67e22 },
            marketing: { x: 320, y: 190, w: 280, h: 200, name: 'المبيعات والطباعة', color: 0x16c79a },
            lounge: { x: 20, y: 410, w: 580, h: 100, name: 'الاستراحة', color: 0x555555 }
        };

        let gameScene;
        let employees = [];
        let activeTasks = [];
        let managerSprite;

        // ==== دالة توليد عشوائي ====
        function getRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

        function addLog(msg, highlight = false) {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = 'log-entry ' + (highlight ? 'log-highlight' : '');
            const time = new Date().toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
            entry.innerText = `[${time}] ${msg}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // ==== مولّد البيانات العشوائية (الذكاء) ====
        const IDEAS = {
            videoThemes: ['تحول الورق العادي إلى تحفة فنية', 'رسم اسم العميل بخط اليد في 10 ثواني', 'كواليس تجهيز بوكس هدايا فاخر', 'مقارنة بين الخط الكوفي والديواني', 'طريقة تغليف هدية التخرج'],
            videoMusic: ['Lo-Fi هادئة', 'عود عربي هادئ', 'بيانو حزين وفخم', 'موسيقى صعود (Trending)'],
            cardTypes: ['بطاقة تخرج ذهبية', 'دعوة زفاف بخط الثلث', 'بطاقة شكر للمعلمين', 'لوحة خط عربي للجدران'],
            cardMaterials: ['ورق قطني فاخر', 'ورق كرافت طبيعي', 'ورق مقوى لامع', 'جلد صناعي للغلاف'],
            priceItems: ['بوكس هدايا (بطاقة + شمعة)', 'تغليف هدية تخرج', 'لوحة خط عربي 30x40', 'بطاقة مناسبات مخصصة'],
            competitors: [
                { name: '@design_by_sara', followers: 12500, type: 'تصميم جرافيك عام', weakness: 'لا يهتم بالخط العربي' },
                { name: '@luxury_cards_ly', followers: 8400, type: 'بطاقات فاخرة', weakness: 'أسعارهم مرتفعة جداً' },
                { name: '@art_arabic', followers: 22000, type: 'لوحات خط', weakness: 'لا يقدمون باقات هدايا' },
                { name: '@graduation_gifts_libya', followers: 5600, type: 'هدايا تخرج', weakness: 'التصميم مكرر وغير مخصص' }
            ]
        };

        class Employee {
            constructor(scene, x, y, name, dept, color) {
                this.scene = scene;
                this.name = name;
                this.dept = dept;
                this.homeX = x;
                this.homeY = y;
                this.isMoving = false;
                this.isWorking = false;
                
                this.container = scene.add.container(x, y);
                const body = scene.add.rectangle(0, 0, 14, 18, color);
                body.setStrokeStyle(2, 0x000000);
                const head = scene.add.circle(0, -14, 7, 0xffdbac);
                head.setStrokeStyle(2, 0x000000);
                const hair = scene.add.rectangle(0, -20, 14, 6, 0x2C2C2C);
                hair.setStrokeStyle(1, 0x000000);
                const label = scene.add.text(0, 24, name, { fontSize: '9px', color: '#fff', fontStyle: 'bold', backgroundColor: 'rgba(0,0,0,0.7)', padding: {x:3, y:1} }).setOrigin(0.5);
                
                this.container.add([body, head, hair, label]);
                scene.physics.add.existing(this.container);
                this.container.body.setSize(18, 26);
                this.container.body.setCollideWorldBounds(true);
                
                // شريط التقدم فوق الرأس
                this.workBubble = scene.add.container(x, y - 35);
                this.workBubble.setVisible(false);
                const bubbleBg = scene.add.rectangle(0, 0, 34, 10, 0x000000, 0.8);
                bubbleBg.setStrokeStyle(1, 0xffffff);
                this.progressBarFill = scene.add.rectangle(-16, 0, 0, 6, 0x00ff00).setOrigin(0, 0.5);
                this.workIcon = scene.add.text(0, -12, '⚙️', { fontSize: '10px' }).setOrigin(0.5);
                
                this.workBubble.add([bubbleBg, this.progressBarFill, this.workIcon]);
            }

            moveTo(targetX, targetY, callback) {
                this.isMoving = true;
                this.target = { x: targetX, y: targetY };
                this.callback = callback;
            }

            updateProgress(percent) {
                this.progressBarFill.width = 32 * (percent / 100);
            }

            update(speed = 120) {
                if (this.workBubble.visible) {
                    this.workBubble.x = this.container.x;
                    this.workBubble.y = this.container.y - 35;
                }
                if (!this.isMoving || !this.target) return;
                const dx = this.target.x - this.container.x;
                const dy = this.target.y - this.container.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < 5) {
                    this.container.x = this.target.x;
                    this.container.y = this.target.y;
                    this.isMoving = false;
                    this.target = null;
                    if (this.callback) { this.callback(); this.callback = null; }
                    return;
                }
                this.container.x += (dx / dist) * speed * (1/60);
                this.container.y += (dy / dist) * speed * (1/60);
            }
        }

        class MainScene extends Phaser.Scene {
            constructor() { super('MainScene'); }
            create() {
                gameScene = this;
                this.cameras.main.setBackgroundColor('#1a1a2e');
                Object.keys(ROOMS).forEach(key => {
                    const r = ROOMS[key];
                    const rect = this.add.rectangle(r.x + r.w/2, r.y + r.h/2, r.w, r.h, r.color, 0.2);
                    rect.setStrokeStyle(3, 0xffffff, 0.5);
                    this.add.text(r.x + 10, r.y + 10, r.name, { fontSize: '12px', color: '#fff', fontStyle: 'bold' });
                });

                const m = ROOMS.manager;
                this.add.rectangle(m.x + 60, m.y + 90, 80, 30, 0x8B4513).setStrokeStyle(2, 0x000000);
                this.add.circle(m.x + 60, m.y + 70, 12, 0x000000);

                managerSprite = new Employee(this, m.x + 60, m.y + 70, 'Olivia 👑', 'manager', 0xf1c40f);
                employees.push(managerSprite);

                const depts = ['design', 'social', 'marketing'];
                const names = ['أحمد','سارة','محمد','نورة','خالد','مريم','علي','فاطمة','يوسف','ليلى','راشد','هند','عمر','دانة','سلمان','شهد','طلال','ريم','بدر','لمى','ناصر','منى','تركي','جواهر','سعد','عبير','ماجد','أمل','فيصل','عبير'];
                
                for (let i = 0; i < 30; i++) {
                    const dept = depts[i % 3];
                    const room = ROOMS[dept];
                    const x = room.x + 20 + Math.random() * (room.w - 40);
                    const y = room.y + 30 + Math.random() * (room.h - 60);
                    employees.push(new Employee(this, x, y, names[i], dept, COLORS[i % COLORS.length]));
                }
                addLog('✅ النظام جاهز. يمكنك تشغيل مهام متعددة الآن.', true);
            }
            update() { employees.forEach(emp => emp.update(120)); }
        }

        const config = { type: Phaser.AUTO, width: GAME_WIDTH, height: GAME_HEIGHT, parent: 'phaser-game', physics: { default: 'arcade' }, scene: MainScene };
        const game = new Phaser.Game(config);

        // ==== إدارة التقارير ====
        function addReportToUI(title, empName, icon, resultHTML, managerNote) {
            const container = document.getElementById('reports-container');
            if (container.querySelector('p')) container.innerHTML = ''; // مسح رسالة البداية
            
            const card = document.createElement('div');
            card.className = 'report-card';
            card.innerHTML = `
                <div class="report-header">
                    <span class="report-title">${icon} ${title}</span>
                    <span class="report-emp">👤 ${empName}</span>
                </div>
                <div class="report-body">${resultHTML}</div>
                <div class="manager-note">👑 <b>ملاحظة المديرة:</b> ${managerNote}</div>
            `;
            container.prepend(card);
        }

        // ==== تنفيذ المهام ====
        function assignTask() {
            if (!gameScene) return;
            
            const depts = ['design', 'social', 'marketing'];
            const dept = getRandom(depts);
            const room = ROOMS[dept];
            const deptEmps = employees.filter(e => e.dept === dept && !e.isWorking);
            
            if (deptEmps.length === 0) {
                addLog('⚠️ جميع موظفي هذا القسم مشغولون حالياً!', true);
                return;
            }
            
            const emp = getRandom(deptEmps);
            emp.isWorking = true;
            const duration = Math.floor(Math.random() * 15) + 10; // 10 إلى 25 ثانية
            
            let taskName = '', icon = '', resultHTML = '', managerNote = '';
            
            // توليد النتيجة العشوائية
            if (dept === 'design') {
                const type = getRandom(IDEAS.cardTypes);
                const mat = getRandom(IDEAS.cardMaterials);
                icon = '🎨';
                taskName = `تصميم ${type}`;
                resultHTML = `
                    <span class="badge">مخرج التصميم</span>
                    <p><b>المنتج:</b> ${type}</p>
                    <p><b>المواد:</b> ${mat}</p>
                    <p><b>الألوان:</b> الذهبي مع الأسود الفاخر.</p>
                    <p><b>الخط:</b> خط ديواني جلي لاسم العميل.</p>
                `;
                managerNote = `"أعجبني اختيار ${mat}، لكن أضف لمسة من اللون الوردي في الزاوية لجذب الانتباه."`;
            } 
            else if (dept === 'social') {
                const theme = getRandom(IDEAS.videoThemes);
                const music = getRandom(IDEAS.videoMusic);
                icon = '🎬';
                taskName = `اختراع فكرة فيديو ريلز`;
                resultHTML = `
                    <span class="badge">فيديو Reels (15 ثانية)</span>
                    <p><b>الفكرة:</b> ${theme}</p>
                    <p><b>السيناريو:</b> لقطة قريبة (0-4 ث) ← رسم بطيء (4-10 ث) ← النتيجة النهائية (10-15 ث).</p>
                    <p><b>الموسيقى:</b> ${music}</p>
                `;
                managerNote = `"فكرة جيدة جداً. تأكد أن الفيديو يظهر شعار @_olivia.design_ بوضوح في أول ثانية."`;
            } 
            else {
                const item = getRandom(IDEAS.priceItems);
                const cost = Math.floor(Math.random() * 40) + 15;
                const profit = Math.floor(cost * 0.6);
                icon = '💰';
                taskName = `تسعير ${item}`;
                resultHTML = `
                    <span class="badge">تحليل مالي</span>
                    <p><b>المنتج:</b> ${item}</p>
                    <p><b>التكلفة:</b> ${cost} د.ل</p>
                    <p><b>هامش الربح (60%):</b> ${profit} د.ل</p>
                    <p><b>سعر البيع النهائي:</b> <span style="color:#e94560; font-weight:bold;">${cost + profit} د.ل</span></p>
                `;
                managerNote = `"السعر منطقي. أضف خيار 'شحن مجاني' للطلبات فوق 100 د.ل لزيادة المبيعات."`;
            }

            addLog(`📋 بدأ ${emp.name} مهمة: ${taskName}`, true);
            
            const targetX = room.x + 20 + Math.random() * (room.w - 40);
            const targetY = room.y + room.h - 30;
            
            emp.moveTo(targetX, targetY, () => {
                emp.workBubble.setVisible(true);
                emp.workIcon.setText(icon);
                emp.updateProgress(0);
                
                const taskObj = { emp, duration, elapsed: 0, taskName, icon, resultHTML, managerNote };
                activeTasks.push(taskObj);
            });
        }

        // ==== الاجتماع ====
        function callMeeting() {
            if (!gameScene) return;
            addLog('📢 المديرة Olivia تدعو الجميع لقاعة الاجتماعات...', true);
            employees.forEach(emp => {
                const m = ROOMS.meeting;
                emp.moveTo(m.x + 20 + Math.random() * (m.w - 40), m.y + 30 + Math.random() * (m.h - 60), () => {
                    if (emp.name.includes('Olivia')) {
                        setTimeout(() => {
                            addLog('🗣️ مناقشة خطة إنتاج المحتوى للشهر القادم.', false);
                            setTimeout(() => {
                                employees.forEach(e => e.moveTo(e.homeX, e.homeY));
                                addLog('🔚 انتهى الاجتماع. العودة للمكاتب.');
                            }, 2500);
                        }, 1500);
                    }
                });
            });
        }

        // ==== تحليل المنافسين ====
        function analyzeCompetitors() {
            let compHTML = `<span class="badge">تحليل السوق (Instagram)</span>`;
            compHTML += `<p style="font-size:12px;">تم تحليل 4 حسابات منافسة في ليبيا:</p>`;
            
            IDEAS.competitors.forEach(comp => {
                compHTML += `
                    <div style="border:1px solid #ddd; padding:8px; margin-bottom:8px; border-radius:6px; background:#f9f9f9;">
                        <h4 style="color:#e1306c; margin:0 0 3px 0; font-size:13px;">${comp.name}</h4>
                        <p style="margin:0; font-size:11px;">👥 المتابعون: <b>${comp.followers.toLocaleString()}</b></p>
                        <p style="margin:0; font-size:11px;">🎨 التخصص: ${comp.type}</p>
                        <p style="margin:3px 0 0 0; color:#c0392b; font-size:11px;">⚠️ ضعفهم: ${comp.weakness}</p>
                    </div>
                `;
            });
            
            compHTML += `
                <h4 style="color:#0f3460; margin-top:10px; font-size:13px;">🎯 الفرصة الذهبية لأوليفيا:</h4>
                <p style="font-size:12px;">دمج الخط العربي الفاخر مع باقات الهدايا سيجعلك الخيار الأول في السوق الليبي.</p>
            `;
            
            addReportToUI("تحليل الحسابات المنافسة", "فريق السوشيال", "🔍", compHTML, `"المنافسة قوية لكننا نمتلك لمسة فنية لا يمتلكونها. ركزوا على الخط العربي."`);
            addLog("🔍 تم إجراء تحليل شامل للمنافسين.", true);
        }

        // ==== النصائح ====
        function getInstagramAdvice() {
            const adviceHTML = `
                <span class="badge">خطة نمو @_olivia.design_</span>
                <p style="font-size:12px;"><b>الوضع الحالي:</b> محتوى بصري قوي، يحتاج لزيادة الوصول (Reach).</p>
                <ul style="font-size:12px; padding-right:15px;">
                    <li><b>الهايلايتس:</b> أضيفي "آراء العملاء" و "طريقة الطلب".</li>
                    <li><b>التفاعل:</b> اطرحي سؤالاً في نهاية كل منشور.</li>
                    <li><b>التعاون:</b> بث مباشر مع مصور أعراس ليبي.</li>
                </ul>
            `;
            addReportToUI("نصائح لتطوير الحساب", "فريق التسويق", "💡", adviceHTML, `"أتفق تماماً. لنبدأ بتطبيق خاصية الهايلايتس هذا الأسبوع."`);
            addLog("💡 تم عرض النصائح.", true);
        }

        // ==== حلقة تحديث المهام ====
        setInterval(() => {
            for (let i = activeTasks.length - 1; i >= 0; i--) {
                const task = activeTasks[i];
                task.elapsed += 0.1;
                const percent = Math.min(100, (task.elapsed / task.duration) * 100);
                task.emp.updateProgress(percent);
                
                if (percent >= 100) {
                    addLog(`✅ ${task.emp.name} أنهى: ${task.taskName}`, true);
                    task.emp.workBubble.setVisible(false);
                    task.emp.isWorking = false;
                    
                    // إضافة التقرير للوحة اليسرى
                    addReportToUI(task.taskName, task.emp.name, task.icon, task.resultHTML, task.managerNote);
                    
                    // عودة الموظف
                    task.emp.moveTo(task.emp.homeX, task.emp.homeY);
                    activeTasks.splice(i, 1);
                }
            }
        }, 100);
    </script>
</body>
</html>
