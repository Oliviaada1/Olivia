<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olivia Design Agency - Simulation</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #1a1a2e; font-family: 'Segoe UI', Tahoma, sans-serif; color: white; overflow: hidden; }
        
        #game-container { display: flex; height: 100vh; width: 100vw; direction: ltr; }
        #canvas-wrapper { flex: 1; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; background: #0f0f1a; }
        
        #sidebar { width: 330px; background: #16213e; padding: 20px; overflow-y: auto; border-left: 3px solid #0f3460; direction: rtl; flex-shrink: 0; box-shadow: -5px 0 15px rgba(0,0,0,0.5); z-index: 10; }
        
        h2 { color: #e94560; text-align: center; margin-bottom: 15px; font-size: 20px; border-bottom: 2px solid #e94560; padding-bottom: 10px; }
        
        button { width: 100%; padding: 12px; margin-bottom: 10px; background: #0f3460; color: white; border: 2px solid #e94560; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; transition: 0.3s; }
        button:hover { background: #e94560; transform: translateY(-2px); }
        
        #log { background: #000; padding: 10px; height: 200px; overflow-y: auto; font-size: 12px; border-radius: 8px; border: 1px solid #444; margin-top: 15px; }
        .log-entry { margin-bottom: 6px; color: #aaa; line-height: 1.4; }
        .log-highlight { color: #f1c40f; font-weight: bold; }
        
        #instagram-panel { display: none; background: #fff; color: #333; padding: 15px; border-radius: 10px; margin-top: 15px; border: 3px solid #e1306c; text-align: right; }
        #instagram-panel h3 { color: #e1306c; margin-bottom: 10px; text-align: center; }
        .stat { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; border-bottom: 1px dashed #ccc; padding-bottom: 4px; }
        .palette { display: flex; gap: 5px; justify-content: center; margin-top: 10px; }
        .color-box { width: 30px; height: 30px; border-radius: 5px; border: 1px solid #ccc; }
        
        #progress-container { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 400px; display: none; background: rgba(0,0,0,0.9); padding: 15px; border-radius: 10px; border: 2px solid #f1c40f; z-index: 100; direction: rtl; }
        #progress-text { margin-bottom: 8px; text-align: center; font-weight: bold; color: #f1c40f; }
        #progress-bar-bg { background: #333; height: 20px; border-radius: 10px; overflow: hidden; }
        #progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #e94560, #f1c40f); transition: width 0.1s; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="canvas-wrapper">
            <div id="progress-container">
                <div id="progress-text">جاري تنفيذ المهمة...</div>
                <div id="progress-bar-bg"><div id="progress-bar-fill"></div></div>
            </div>
            <div id="phaser-game"></div>
        </div>

        <div id="sidebar">
            <h2>🎨 Olivia Agency</h2>
            <button onclick="assignTask()">📋 توزيع مهمة جديدة</button>
            <button onclick="callMeeting()">📢 عقد الاجتماع الأسبوعي</button>
            <button onclick="analyzeInstagram()">📸 تحليل @_olivia.design_</button>
            <button onclick="resetSim()" style="background:#c0392b; border-color:#c0392b;">🔄 إعادة التشغيل</button>

            <div id="instagram-panel">
                <h3>📊 تحليل @_olivia.design_</h3>
                <div class="stat"><span>الاسم:</span><b>أوليفيا | مصممة جرافيك</b></div>
                <div class="stat"><span>المتابعون:</span><b>224</b></div>
                <div class="stat"><span>المنشورات:</span><b>71</b></div>
                <div class="stat"><span>المتابَعون:</span><b>91</b></div>
                <div class="stat"><span>التخصص:</span><b>الخط العربي والمطبوعات</b></div>
                <div class="stat"><span>الموقع:</span><b>ليبيا 🇱🇾</b></div>
                <div class="palette">
                    <div class="color-box" style="background:#FADADD" title="وردي فاتح"></div>
                    <div class="color-box" style="background:#E8DCC4" title="بيج"></div>
                    <div class="color-box" style="background:#2C2C2C" title="أسود"></div>
                    <div class="color-box" style="background:#D4AF37" title="ذهبي"></div>
                </div>
            </div>

            <h3 style="margin-top:20px; font-size:14px; color:#e94560;">📝 سجل الأحداث:</h3>
            <div id="log"></div>
        </div>
    </div>

    <script>
        const GAME_WIDTH = window.innerWidth - 330; 
        const GAME_HEIGHT = window.innerHeight;
        
        const COLORS = [0xe94560, 0x0f3460, 0x16c79a, 0xf1c40f, 0x9b59b6, 0xe67e22];
        
        const ROOMS = {
            manager: { x: 20, y: 20, w: 250, h: 180, name: 'مكتب المديرة', color: 0x2c3e50 },
            design: { x: 300, y: 20, w: 250, h: 180, name: 'قسم التصميم', color: 0x3498db },
            social: { x: 580, y: 20, w: 250, h: 180, name: 'السوشيال ميديا', color: 0xe1306c },
            meeting: { x: 20, y: 230, w: 400, h: 250, name: 'قاعة الاجتماعات', color: 0xe67e22 },
            marketing: { x: 450, y: 230, w: 380, h: 250, name: 'قسم المبيعات والطباعة', color: 0x16c79a },
            lounge: { x: 20, y: 510, w: 810, h: 130, name: 'الاستراحة', color: 0x555555 }
        };

        let gameScene;
        let employees = [];
        let managerSprite;
        let currentTask = null;

        function addLog(msg, highlight = false) {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = 'log-entry ' + (highlight ? 'log-highlight' : '');
            const time = new Date().toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
            entry.innerText = `[${time}] ${msg}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        class Employee {
            constructor(scene, x, y, name, dept, color) {
                this.scene = scene;
                this.name = name;
                this.dept = dept;
                this.color = color;
                this.homeX = x;
                this.homeY = y;
                this.isMoving = false;
                
                this.container = scene.add.container(x, y);
                
                // جسم الموظف (احترافي)
                const body = scene.add.rectangle(0, 0, 18, 22, color);
                body.setStrokeStyle(2, 0x000000);
                
                // الرأس
                const head = scene.add.circle(0, -18, 9, 0xffdbac);
                head.setStrokeStyle(2, 0x000000);
                
                // الشعر
                const hair = scene.add.rectangle(0, -25, 18, 8, 0x2C2C2C);
                hair.setStrokeStyle(1, 0x000000);
                
                // الاسم
                const label = scene.add.text(0, 30, name, { fontSize: '10px', color: '#fff', fontStyle: 'bold', backgroundColor: 'rgba(0,0,0,0.7)', padding: {x:4, y:2} }).setOrigin(0.5);
                
                this.container.add([body, head, hair, label]);
                scene.physics.add.existing(this.container);
                this.container.body.setSize(22, 32);
                this.container.body.setCollideWorldBounds(true);
                
                this.target = null;
                this.callback = null;
                
                // فقاعة العمل
                this.workBubble = scene.add.container(x, y - 45);
                this.workBubble.setVisible(false);
                const bubbleBg = scene.add.circle(0, 0, 16, 0xffffff);
                bubbleBg.setStrokeStyle(2, 0x000000);
                this.workBubbleText = scene.add.text(0, 0, '...', { fontSize: '14px', color: '#000' }).setOrigin(0.5);
                this.workBubble.add([bubbleBg, this.workBubbleText]);
            }

            moveTo(targetX, targetY, callback) {
                this.isMoving = true;
                this.target = { x: targetX, y: targetY };
                this.callback = callback;
            }

            update(speed = 120) {
                if (this.workBubble.visible) {
                    this.workBubble.x = this.container.x;
                    this.workBubble.y = this.container.y - 45;
                }

                if (!this.isMoving || !this.target) return;
                
                const dx = this.target.x - this.container.x;
                const dy = this.target.y - this.container.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                if (dist < 5) {
                    this.container.x = this.target.x;
                    this.container.y = this.target.y;
                    this.isMoving = false;
                    this.target = null;
                    if (this.callback) { this.callback(); this.callback = null; }
                    return;
                }
                
                this.container.x += (dx / dist) * speed * (1/60);
                this.container.y += (dy / dist) * speed * (1/60);
            }
        }

        class MainScene extends Phaser.Scene {
            constructor() { super('MainScene'); }

            create() {
                gameScene = this;
                this.cameras.main.setBackgroundColor('#1a1a2e');

                Object.keys(ROOMS).forEach(key => {
                    const r = ROOMS[key];
                    const rect = this.add.rectangle(r.x + r.w/2, r.y + r.h/2, r.w, r.h, r.color, 0.2);
                    rect.setStrokeStyle(3, 0xffffff, 0.5);
                    this.add.text(r.x + 10, r.y + 10, r.name, { fontSize: '14px', color: '#fff', fontStyle: 'bold' });
                });

                // مكتب المديرة
                const m = ROOMS.manager;
                this.add.rectangle(m.x + 80, m.y + 120, 100, 40, 0x8B4513).setStrokeStyle(2, 0x000000);
                this.add.circle(m.x + 80, m.y + 90, 15, 0x000000);
                this.add.text(m.x + 80, m.y + 145, 'Olivia', { fontSize: '11px', color: '#f1c40f', fontStyle: 'bold' }).setOrigin(0.5);

                managerSprite = new Employee(this, m.x + 80, m.y + 90, 'Olivia 👑', 'manager', 0xf1c40f);
                employees.push(managerSprite);

                const depts = ['design', 'social', 'marketing'];
                const names = ['أحمد','سارة','محمد','نورة','خالد','مريم','علي','فاطمة','يوسف','ليلى','راشد','هند','عمر','دانة','سلمان','شهد','طلال','ريم','بدر','لمى','ناصر','منى','تركي','جواهر','سعد','عبير','ماجد','أمل','فيصل','عبير'];
                
                for (let i = 0; i < 30; i++) {
                    const dept = depts[i % 3];
                    const room = ROOMS[dept];
                    const x = room.x + 40 + Math.random() * (room.w - 80);
                    const y = room.y + 50 + Math.random() * (room.h - 100);
                    const emp = new Employee(this, x, y, names[i], dept, COLORS[i % COLORS.length]);
                    employees.push(emp);
                }

                addLog('✅ تم بدء محاكاة شركة أوليفيا.', true);
            }

            update() {
                employees.forEach(emp => emp.update(120));
            }
        }

        const config = {
            type: Phaser.AUTO,
            width: GAME_WIDTH,
            height: GAME_HEIGHT,
            parent: 'phaser-game',
            physics: { default: 'arcade' },
            scene: MainScene
        };
        const game = new Phaser.Game(config);

        // ==== المهام المخصصة لحساب أوليفيا ====
        function assignTask() {
            if (!gameScene || currentTask) return;
            
            const tasks = [
                { dept: 'design', name: 'تصميم بطاقة تخرج', act: 'جاري اختيار الألوان والخطوط...', icon: '🎓' },
                { dept: 'design', name: 'تصميم لوحة خط عربي', act: 'جاري رسم الحروف...', icon: '🖋️' },
                { dept: 'marketing', name: 'تجهيز باقة ورد وتغليف', act: 'جاري تنسيق الباقة...', icon: '💐' },
                { dept: 'marketing', name: 'طباعة بطاقات مناسبات', act: 'جاري ضبط إعدادات الماكينة...', icon: '🖨️' },
                { dept: 'social', name: 'تصوير منتج للإنستغرام', act: 'جاري ضبط الإضاءة...', icon: '📸' },
                { dept: 'social', name: 'جدولة منشورات الأسبوع', act: 'جاري كتابة الوصف...', icon: '📱' },
                { dept: 'design', name: 'تصميم باقة زفاف', act: 'جاري انتقاء الورق الفاخر...', icon: '💍' }
            ];
            
            const task = tasks[Math.floor(Math.random() * tasks.length)];
            const room = ROOMS[task.dept];
            const deptEmps = employees.filter(e => e.dept === task.dept);
            
            if (deptEmps.length === 0) return;
            
            const emp = deptEmps[Math.floor(Math.random() * deptEmps.length)];
            const duration = Math.floor(Math.random() * 10) + 8; 
            
            addLog(`📋 تم تكليف ${emp.name} بمهمة: ${task.name}`, true);
            
            const targetX = room.x + 50;
            const targetY = room.y + room.h - 50;
            
            emp.moveTo(targetX, targetY, () => {
                emp.workBubble.setVisible(true);
                emp.workBubbleText.setText(task.icon);
                
                currentTask = { emp, duration, elapsed: 0, task, targetX, targetY };
                
                const pc = document.getElementById('progress-container');
                const pf = document.getElementById('progress-bar-fill');
                const pt = document.getElementById('progress-text');
                pc.style.display = 'block';
                pt.innerText = `${emp.name}: ${task.act}`;
                pf.style.width = '0%';
            });
        }

        function callMeeting() {
            if (!gameScene || currentTask) return;
            addLog('📢 المديرة Olivia تدعو الجميع لقاعة الاجتماعات...', true);
            
            employees.forEach(emp => {
                const m = ROOMS.meeting;
                const tx = m.x + 40 + Math.random() * (m.w - 80);
                const ty = m.y + 40 + Math.random() * (m.h - 80);
                emp.moveTo(tx, ty, () => {
                    if (emp.name.includes('Olivia')) {
                        addLog('✅ الجميع في القاعة. بدء الاجتماع.', true);
                        setTimeout(() => {
                            addLog('🗣️ مناقشة خطة إنتاج المحتوى للشهر القادم.', false);
                            setTimeout(() => {
                                addLog('🔚 انتهى الاجتماع. العودة للمكاتب.');
                                employees.forEach(e => e.moveTo(e.homeX, e.homeY));
                            }, 2500);
                        }, 1500);
                    }
                });
            });
        }

        function analyzeInstagram() {
            if (!gameScene || currentTask) return;
            addLog('📸 جاري دراسة حساب @_olivia.design_...', true);
            addLog('👥 فريق السوشيال ميديا والمديرة يتوجهون للاجتماع.', true);
            
            const m = ROOMS.meeting;
            const socialTeam = employees.filter(e => e.dept === 'social' || e.name.includes('Olivia'));
            
            socialTeam.forEach(emp => {
                const tx = m.x + 40 + Math.random() * (m.w - 80);
                const ty = m.y + 40 + Math.random() * (m.h - 80);
                emp.moveTo(tx, ty);
            });
            
            const pc = document.getElementById('progress-container');
            const pf = document.getElementById('progress-bar-fill');
            const pt = document.getElementById('progress-text');
            pc.style.display = 'block';
            pf.style.width = '0%';
            pt.innerText = 'جاري تحليل بيانات الحساب...';
            
            let progress = 0;
            const interval = setInterval(() => {
                progress += 2;
                pf.style.width = progress + '%';
                if (progress >= 100) {
                    clearInterval(interval);
                    pt.innerText = '✅ اكتمل التحليل!';
                    document.getElementById('instagram-panel').style.display = 'block';
                    addLog('✅ اكتمل تحليل الحساب.', true);
                    setTimeout(() => { pc.style.display = 'none'; }, 2000);
                }
            }, 100);
        }

        function resetSim() { location.reload(); }

        // تحديث شريط التقدم والفقاعات
        setInterval(() => {
            if (currentTask) {
                currentTask.elapsed += 0.1;
                const percent = Math.min(100, (currentTask.elapsed / currentTask.duration) * 100);
                document.getElementById('progress-bar-fill').style.width = percent + '%';
                
                if (percent >= 100) {
                    addLog(`✅ ${currentTask.emp.name} أنهى مهمة: ${currentTask.task.name}`, true);
                    
                    const emp = currentTask.emp;
                    emp.workBubble.setVisible(false);
                    
                    // تأثير النجاح
                    const successBubble = emp.scene.add.text(emp.container.x, emp.container.y - 45, '✅', { fontSize: '22px' }).setOrigin(0.5);
                    emp.scene.time.delayedCall(1500, () => successBubble.destroy());

                    currentTask = null;
                    document.getElementById('progress-container').style.display = 'none';
                    emp.moveTo(emp.homeX, emp.homeY);
                }
            }
        }, 100);
    </script>
</body>
</html>
